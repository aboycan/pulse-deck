name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
  - type: checkboxes
    id: original
    attributes:
      label: Originality
      options:
        - label: This request does not ask PulseDeck to copy another player's proprietary skins, artwork or branding.
          required: true
